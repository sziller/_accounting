<section class="card entries-card">
    <div class="entries-heading">
        <h2>Entries</h2>
        <p class="muted">Select a row to inspect its data and source image.</p>
    </div>

    <div class="entries-table-wrap">
        <table class="entries-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Counterparty</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>VAT</th>
                    <th>Deductible</th>
                </tr>
            </thead>
            <tbody id="entries-body"></tbody>
        </table>
    </div>
</section>
