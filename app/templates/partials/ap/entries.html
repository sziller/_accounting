<section class="card entries-card">

    <div class="records-heading">
        <div class="records-heading-copy">
            <h2>Entries</h2>
            <p class="muted">
                Browse and select accounts payable entries.
            </p>
        </div>

        <div class="records-heading-actions">
            <button
                    disabled
                    id="previous-entry"
                    type="button">
                &larr; Previous
            </button>

            <button
                    disabled
                    id="next-entry"
                    type="button">
                Next &rarr;
            </button>

            <button
                    id="refresh-entries"
                    type="button">
                Refresh
            </button>
        </div>
    </div>

    <div class="entries-table-wrap">
        <table class="entries-table">
            <thead>
            <tr>
                <th>Date</th>
                <th>Counterparty</th>
                <th>Category</th>
                <th>Amount</th>
                <th>VAT</th>
                <th>Deductible</th>
            </tr>
            </thead>

            <tbody id="entries-body"></tbody>
        </table>
    </div>

</section>
