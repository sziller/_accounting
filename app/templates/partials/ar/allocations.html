<h3 data-i18n="allocations.title">Payments / Allocations</h3>

<ul id="ar-allocation-list"></ul>

<form id="ar-allocation-form" class="form-grid">
    <label>
        <span data-i18n="allocations.incomingPayment">Incoming payment</span>
        <select id="ar-allocation-payment"></select>
    </label>

    <p id="ar-allocation-remaining"></p>

    <label>
        <span data-i18n="payments.allocatedAmount">Allocated amount</span>
        <input
                id="ar-allocation-amount"
                type="text"
                inputmode="decimal"
                required>
    </label>

    <button data-i18n="allocations.allocatePayment" id="allocate-ar-payment" type="submit">
        Allocate Payment
    </button>
</form>

<pre id="ar-allocation-status" aria-live="polite"></pre>
