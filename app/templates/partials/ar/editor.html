<section class="card">
    <h2 data-i18n="ar.selectedInvoice">Selected Outgoing Invoice</h2>

    <button data-i18n="ar.processEntry" disabled id="process-ar-entry" type="button">
        Process Entry
    </button>

    <p data-i18n="ar.editorHelp" class="muted">
        Select an invoice from the table. Unlock editing to change persisted fields.
    </p>

    <div class="json-actions ar-editor-actions">
        <button data-i18n="ar.unlockEditing" disabled id="unlock-ar-invoice-edit" type="button">
            Unlock Editing
        </button>
        <button data-i18n="common.save" disabled id="save-ar-invoice-edit" type="button">
            Save Changes
        </button>
        <button data-i18n="common.cancel" disabled id="cancel-ar-invoice-edit" type="button">
            Cancel
        </button>
    </div>

    <form class="form-grid" id="ar-invoice-detail-form">
        <label>
            <span data-i18n="ar.field.invoiceNumber">Invoice Number</span>
            <input
                    disabled
                    id="ar-invoice-invoice_number"
                    name="invoice_number"
                    type="text"
                    required>
        </label>

        <label>
            <span data-i18n="ar.field.invoiceDate">Invoice Date</span>
            <input
                    disabled
                    id="ar-invoice-invoice_date"
                    name="invoice_date"
                    type="date"
                    required>
        </label>

        <label>
            <span data-i18n="ar.field.dueDate">Due Date</span>
            <input
                    disabled
                    id="ar-invoice-due_date"
                    name="due_date"
                    type="date">
        </label>

        <label>
            <span data-i18n="ar.field.paymentDate">Payment Received Date</span>
            <input
                    disabled
                    id="ar-invoice-payment_date"
                    name="payment_date"
                    type="date">
        </label>

        <label>
            <span data-i18n="ar.field.customerName">Customer Name</span>
            <input
                    disabled
                    id="ar-invoice-customer_name"
                    name="customer_name"
                    type="text"
                    required>
        </label>

        <label>
            <span data-i18n="ar.field.customerReference">Customer Reference</span>
            <input
                    disabled
                    id="ar-invoice-customer_reference"
                    name="customer_reference"
                    type="text">
        </label>

        <label>
            <span data-i18n="ar.field.currencyOriginal">Original Currency</span>
            <input
                    disabled
                    id="ar-invoice-currency_original"
                    name="currency_original"
                    type="text"
                    required
                    maxlength="3"
                    pattern="[A-Z]{3}">
        </label>

        <label>
            <span data-i18n="ar.field.netAmount">Original Net Amount</span>
            <input
                    disabled
                    id="ar-invoice-net_amount"
                    name="net_amount"
                    type="text"
                    inputmode="decimal">
        </label>

        <label>
            <span data-i18n="ar.field.vatAmount">Original VAT Amount</span>
            <input
                    disabled
                    id="ar-invoice-vat_amount"
                    name="vat_amount"
                    type="text"
                    inputmode="decimal">
        </label>

        <label>
            <span data-i18n="ar.field.grossAmount">Original Gross Amount</span>
            <input
                    disabled
                    id="ar-invoice-amount_original"
                    name="amount_original"
                    type="text"
                    required
                    inputmode="decimal">
        </label>

        <label>
            <span data-i18n="ar.field.currencyCommon">Common Currency</span>
            <input
                    disabled
                    id="ar-invoice-currency_common"
                    name="currency_common"
                    type="text"
                    required
                    maxlength="3"
                    pattern="[A-Z]{3}">
        </label>

        <label>
            <span data-i18n="ar.field.pdfFilename">PDF Filename</span>
            <input
                    disabled
                    id="ar-invoice-pdf_filename"
                    name="pdf_filename"
                    type="text">
        </label>

        <label>
            <span data-i18n="ar.field.pdfSha256">PDF SHA-256</span>
            <input
                    disabled
                    id="ar-invoice-pdf_sha256"
                    name="pdf_sha256"
                    type="text">
        </label>

        <label class="field-wide">
            <span data-i18n="common.remarks">Remarks</span>
            <textarea
                    disabled
                    id="ar-invoice-remarks"
                    name="remarks"></textarea>
        </label>

        <h3 data-i18n="ar.derivedFields" class="form-section-title">
            Derived / Read-only Fields
        </h3>

        <label>
            <span data-i18n="ar.field.amountCommon">Common Amount</span>
            <input
                    readonly
                    id="ar-invoice-amount_common"
                    type="text"
                    data-i18n-placeholder="ar.pendingNormalization" placeholder="Pending normalization">
        </label>

        <label>
            <span data-i18n="ar.field.paid">Paid (original currency)</span>
            <input
                    readonly
                    id="ar-invoice-paid_amount"
                    type="text">
        </label>

        <label>
            <span data-i18n="ar.field.outstanding">Outstanding (original currency)</span>
            <input
                    readonly
                    id="ar-invoice-outstanding_amount"
                    type="text">
        </label>

        <label>
            <span data-i18n="ar.field.paymentStatus">Payment Status</span>
            <input
                    readonly
                    id="ar-invoice-payment_status"
                    type="text">
        </label>

        <label>
            <span data-i18n="ar.field.createdAt">Created At</span>
            <input
                    readonly
                    id="ar-invoice-created_at"
                    type="text">
        </label>

        <label>
            <span data-i18n="ar.field.updatedAt">Updated At</span>
            <input
                    readonly
                    id="ar-invoice-updated_at"
                    type="text">
        </label>
    </form>

    <pre id="ar-invoice-editor-status" aria-live="polite">Select an outgoing invoice.</pre>

    {% include "partials/ar/allocations.html" %}
    {% include "partials/ar/recognition.html" %}
</section>
