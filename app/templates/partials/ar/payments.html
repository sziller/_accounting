<section class="card" id="ar-payments-panel">
    <h2 data-i18n="payments.title">Incoming Payments</h2>

    <div class="json-actions">
        <button data-i18n="payments.newPayment" id="new-ar-payment" type="button">
            New Payment
        </button>

        <button data-i18n="payments.refresh" id="refresh-ar-payments" type="button">
            Refresh Payments
        </button>
    </div>

    <div style="overflow-x: auto">
        <table class="ar-db-table">
            <thead>
                <tr>
                    <th data-i18n="payments.paymentDate">Payment date</th>
                    <th data-i18n="common.amount">Amount</th>
                    <th data-i18n="common.currency">Currency</th>
                    <th data-i18n="payments.payer">Payer</th>
                    <th data-i18n="payments.bankReference">Bank/reference</th>
                    <th data-i18n="payments.paymentMethod">Payment method</th>
                    <th data-i18n="payments.allocatedAmount">Allocated amount</th>
                    <th data-i18n="payments.unallocatedAmount">Unallocated amount</th>
                </tr>
            </thead>

            <tbody id="ar-payment-body">
                <tr>
                    <td data-i18n="payments.loading" colspan="8">
                        Loading incoming payments…
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <form class="form-grid" id="ar-payment-form">
        <label>
            <span data-i18n="payments.paymentDate">Payment date</span>
            <input
                    disabled
                    name="payment_date"
                    type="date"
                    required>
        </label>

        <label>
            <span data-i18n="common.amount">Amount</span>
            <input
                    disabled
                    name="amount"
                    type="text"
                    inputmode="decimal"
                    required>
        </label>

        <label>
            <span data-i18n="common.currency">Currency</span>
            <input
                    disabled
                    name="currency"
                    type="text"
                    required
                    placeholder="EUR">
        </label>

        <label>
            <span data-i18n="payments.payer">Payer</span>
            <input
                    disabled
                    name="payer_name"
                    type="text">
        </label>

        <label>
            <span data-i18n="payments.bankReference">Bank/reference</span>
            <input
                    disabled
                    name="bank_reference"
                    type="text">
        </label>

        <label>
            <span data-i18n="payments.paymentMethod">Payment method</span>
            <input
                    disabled
                    name="payment_method"
                    type="text">
        </label>

        <label>
            <span data-i18n="common.remarks">Remarks</span>
            <textarea
                    disabled
                    name="remarks"></textarea>
        </label>

        <label>
            <span data-i18n="payments.allocatedAmount">Allocated amount</span>
            <input
                    readonly
                    name="allocated_amount"
                    type="text">
        </label>

        <label>
            <span data-i18n="payments.unallocatedAmount">Unallocated amount</span>
            <input
                    readonly
                    name="unallocated_amount"
                    type="text">
        </label>

        <div class="json-actions">
            <button
                    disabled
                    id="save-ar-payment"
                    type="submit">
                Save Changes
            </button>

            <button data-i18n="common.cancel"
                    disabled
                    id="cancel-ar-payment"
                    type="button">
                Cancel
            </button>
        </div>
    </form>

    <pre id="ar-payment-status" aria-live="polite"></pre>
</section>
