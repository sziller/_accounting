<section class="card ar-source-card" id="ar-invoice-import-panel">
    <h2>AR Source PDFs</h2>

    <div class="ar-directory-meta">
        <span class="muted">Source directory</span>
        <code id="ar-invoice-directory-name">AR_invoice_pdf</code>
    </div>

    <div class="json-actions ar-invoice-actions">
        <button id="refresh-ar-invoice-files" type="button">
            Refresh
        </button>

        <button id="process-ar-invoice-directory" type="button">
            Update DB from Directory
        </button>
    </div>

    <div class="ar-file-browser" aria-live="polite">
        <div class="ar-file-browser-heading">
            <strong>PDF files</strong>
            <span class="muted" id="ar-invoice-file-count">Loading…</span>
        </div>

        <ul class="ar-file-list" id="ar-invoice-file-list">
            <li class="muted">Loading PDFs…</li>
        </ul>
    </div>

    <pre
            class="ar-import-status"
            id="ar-invoice-import-status"
            aria-live="polite"></pre>
</section>
