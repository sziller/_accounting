<header class="app-header">
    <div class="app-brand">
        <h1>Accounting</h1>
        <p class="page-subtitle">Review, maintain and add bookkeeping entries.</p>
    </div>

    <nav class="view-nav" aria-label="Bookkeeping sections">
        <button
                class="view-nav-button is-active"
                id="show-process-view"
                type="button"
                data-view-target="process-view"
                aria-controls="process-view"
                aria-selected="true">
            Accounts Payable
        </button>

        <button
                class="view-nav-button"
                id="show-ar-view"
                type="button"
                data-view-target="ar-view"
                aria-controls="ar-view"
                aria-selected="false">
            Accounts Receivable
        </button>

        <button
                class="view-nav-button"
                id="show-input-view"
                type="button"
                data-view-target="input-view"
                aria-controls="input-view"
                aria-selected="false">
            New Entries
        </button>

        <button
                class="view-nav-button"
                id="show-summary-view"
                type="button"
                data-view-target="summary-view"
                aria-controls="summary-view"
                aria-selected="false">
            Gewinnermittlung
        </button>
    </nav>
</header>
