<header class="app-header">
    <div class="app-brand">
        <h1 data-i18n="app.title">Accounting</h1>

        <p
                class="page-subtitle"
                data-i18n="app.subtitle">
            Review, maintain and add bookkeeping entries.
        </p>
    </div>

    <nav
            class="view-nav"
            aria-label="Bookkeeping sections"
            data-i18n-aria-label="nav.ariaLabel">

        <button
                class="view-nav-button is-active"
                id="show-process-view"
                type="button"
                data-view-target="process-view"
                aria-controls="process-view"
                aria-selected="true"
                data-i18n="nav.accountsPayable">
            Accounts Payable
        </button>

        <button
                class="view-nav-button"
                id="show-ar-view"
                type="button"
                data-view-target="ar-view"
                aria-controls="ar-view"
                aria-selected="false"
                data-i18n="nav.accountsReceivable">
            Accounts Receivable
        </button>

        <button
                class="view-nav-button"
                id="show-input-view"
                type="button"
                data-view-target="input-view"
                aria-controls="input-view"
                aria-selected="false"
                data-i18n="nav.newEntries">
            New Entries
        </button>

        <button
                class="view-nav-button"
                id="show-summary-view"
                type="button"
                data-view-target="summary-view"
                aria-controls="summary-view"
                aria-selected="false"
                data-i18n="nav.yearlySummary">
            Yearly Summary
        </button>
    </nav>

    <div class="language-selector">
        <label
                for="language-select"
                data-i18n="language.label">
            Language
        </label>

        <select
                id="language-select"
                name="language"
                aria-label="Language">
            <option
                    value="en"
                    data-i18n="language.english">
                English
            </option>

            <option
                    value="de"
                    data-i18n="language.german">
                German
            </option>
        </select>
    </div>
</header>
